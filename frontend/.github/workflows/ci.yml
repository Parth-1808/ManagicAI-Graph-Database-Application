name: ManagicAI CI Pipeline

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  COGNODB_URI: ${{ secrets.COGNODB_URI || 'bolt+s://db-62c8531c.bravo.databases.cognodb.com' }}
  COGNODB_USER: ${{ secrets.COGNODB_USER || 'cognodb' }}
  COGNODB_PASSWORD: ${{ secrets.COGNODB_PASSWORD || 'af829ec1c54011534c1aab45a9dbcd3f' }}
  COGNODB_API_KEY: ${{ secrets.COGNODB_API_KEY || 'cdb_784dabb1_9341b23b1fdcbfd7d85cbf76d0f60afb' }}

jobs:
  typecheck-and-lint:
    name: 1. Code Quality & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

  test-suites:
    name: 2. Automated Test Suites (Sanitizers & API Contracts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Automated Test Suites
        run: npm test

  cognodb-bolt-verification:
    name: 3. CognoDB Cloud openCypher Graph Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Live openCypher Multi-Hop Query Verification
        run: npm run test:queries

  production-build:
    name: 4. Next.js Production Build Validation
    needs: [typecheck-and-lint, test-suites, cognodb-bolt-verification]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Next.js Production Build
        run: npm run build
