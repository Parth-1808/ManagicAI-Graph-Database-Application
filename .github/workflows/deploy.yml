name: ManagicAI CD Deployment

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Production Build
        run: npm run build
        env:
          COGNODB_URI: ${{ secrets.COGNODB_URI || 'bolt+s://db-62c8531c.bravo.databases.cognodb.com' }}
          COGNODB_USER: ${{ secrets.COGNODB_USER || 'cognodb' }}
          COGNODB_PASSWORD: ${{ secrets.COGNODB_PASSWORD || 'af829ec1c54011534c1aab45a9dbcd3f' }}
          COGNODB_API_KEY: ${{ secrets.COGNODB_API_KEY || 'cdb_784dabb1_9341b23b1fdcbfd7d85cbf76d0f60afb' }}

      - name: Deployment Success Notification
        run: |
          echo "🎉 ManagicAI Next.js application & CognoDB Graph Database validated and ready for production deployment!"
